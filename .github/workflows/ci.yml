# =============================================================================
# StarterCpp CI/CD Pipeline
# =============================================================================
# Triggers on push to main branch
# Builds and tests on Linux (GCC) and macOS (Clang)
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Debug

jobs:
  # ===========================================================================
  # Linux Build (Ubuntu with GCC)
  # ===========================================================================
  linux-build:
    name: Linux (GCC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3-pip \
            lcov \
            protobuf-compiler

      - name: Install Conan
        run: |
          pip3 install conan --break-system-packages
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Install dependencies with Conan
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=20

      - name: Patch CycloneDDS headers (GCC 14+ C++20 fix)
        run: |
          # CycloneDDS 0.10.x uses ~Class<T>() destructor syntax that is
          # ill-formed in C++20. GCC 14+ treats this as an unfixable hard error.
          # Patch the headers in the Conan cache to use the correct ~Class() form.
          find ~/.conan2 -path '*/include/ddscxx/*.hpp' -exec \
            sed -i -E 's/~([A-Za-z_][A-Za-z0-9_]*)<[^>]+>\(\)/~\1()/g' {} +

      - name: Configure CMake
        run: cmake --preset ci-linux

      - name: Build
        run: cmake --build --preset ci-linux

      - name: Run tests
        run: ctest --preset ci-linux

      - name: Generate coverage report
        run: cmake --build --preset ci-linux --target coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: build/ci-linux/coverage.info
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  # ===========================================================================
  # macOS Build (Clang)
  # ===========================================================================
  macos-build:
    name: macOS (Clang)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew install cmake ninja protobuf

      - name: Install Conan
        run: |
          pip3 install conan --break-system-packages
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Install dependencies with Conan
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=20

      - name: Configure CMake
        run: cmake --preset ci-macos

      - name: Build
        run: cmake --build --preset ci-macos

# Note: Tests are currently disabled on macOS due to a known issue with the test framework.
      # - name: Run tests
      #   run: ctest --preset ci-macos

